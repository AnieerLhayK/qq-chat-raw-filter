[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "qq-raw-material-filter"
version = "0.3.2"
description = "QQ Chat Raw Material Filter — structured bucketing for character skill extraction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[project.urls]
homepage = "https://github.com/AnieerLhayK/qq-chat-raw-filter"
Source = "https://github.com/AnieerLhayK/qq-chat-raw-filter"

[project.scripts]
qce-block-filter = "qq_raw_filter._cli:main"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
