[meta]
config_version = "0.1"
description = "QQ character skill raw material filter config"

[identity]
me_ids = []
me_names = []

[path]
input_dir = "raw_material/qq/exports/raw/qq-chat-exporter-live"
output_dir = "raw_material/qq/exports/normalized"

[time]
session_gap_minutes = 20
turn_gap_seconds = 90
my_block_continue_seconds = 120

[interruption]
light_interruption_chars = 20
hard_interruption_chars = 90
max_light_interruptions = 4

[my_block]
min_my_block_chars = 20
good_my_block_chars = 100
min_my_char_ratio = 0.60
min_my_msg_count = 1
short_fragment_chars = 3
max_block_chars = 1000
max_fragment_count = 90

[message]
min_isolated_message_chars = 6
very_short_chars = 3
max_single_message_chars = 500

[score]
candidate_min_style_score = 5
candidate_min_chars_when_style_high = 45
micro_style_min_style_score = 2
need_anonymize_min_style_score = 3
junk_reject_score = 5
chaos_separate_score = 2
debatable_min_style_score = 4
debatable_max_per_run = 200

[ratio]
max_short_fragment_ratio = 0.60
max_chaos_ratio_for_candidate = 0.20
max_other_char_ratio_inside_my_block = 0.30

[dedup]
duplicate_keep_limit = 3
near_duplicate_enable = false
near_duplicate_threshold = 0.85

[output]
keep_rejected = true
keep_original_fragments = true
write_debug_sessions = true
write_active_config_snapshot = true
write_human_review_samples = true
human_review_sample_size = 100

[style_markers]
analysis = [
  "我感觉", "其实", "本质上", "主要是", "关键是",
  "问题是", "不是", "而是", "先别", "没必要", "倒也",
  "说白了", "这么说", "怎么说呢",
]
tone = [
  "有点抽象", "绷不住", "确实", "离谱", "草", "啊？",
]

[light_interruption]
phrases = [
  "啊？", "为啥", "然后呢", "确实", "？", "细说", "哈哈哈", "什么意思",
]

[filter]
drop_sentence_words = [
  # Entire block dropped if my_text contains any of these
  "进群", "加我", "加群",
]
mask_words = [
  # Within my_text, replace with [MASKED] before writing output
  "微信号", "手机号",
]
private_names = [
  # Real names to mask — fill in actual names
]
private_places = [
  # Place names to mask — fill in actual places
]

[privacy]
mode = "balanced"   # strict | balanced | recall
high_risk_words = [
  "密码", "验证码", "身份证", "银行卡", "token", "api_key", "secret",
]
medium_risk_words = [
  "学校", "学院", "班级", "宿舍", "寝室", "老师",
  "手机号", "电话", "地址", "学号",
]

[chaos]
mild_words = [
  # Original
  "草", "绷不住", "抽象", "离谱",
  # User's chat patterns — minced oaths
  "byd", "md", "tmd",
  # User's chat patterns — complaint/venting
  "烦死了", "累死了", "困死了", "气死了", "笑死了",
  "我要吐了", "受不了",
  # User's chat patterns — oral slang
  "难绷", "逆天", "包的", "无敌了", "没救了",
  # Common internet oral expressions (2025-2026)
  "哈人", "破防", "无语", "绝了", "完了",
  "尊嘟假嘟", "那咋了", "6",
]
strong_words = [
  "傻逼", "脑残", "滚",
  "有病", "恶心", "废物", "闭嘴",
]

[debatable]
enable = true
max_per_run = 200

[style_tags]
enable = true
argument_markers = ["但是", "不过", "然而", "其实", "话说", "反过来"]
analysis_markers = ["我感觉", "我认为", "我觉得", "本质上", "说白了", "这么说"]

[tuning_advice]
enable = true
candidate_ratio_target_min = 0.05
candidate_ratio_target_max = 0.12
chaos_style_ratio_max = 0.10
